version: 2

models:
  - name: dim_dbt_discussions
    columns:
      - name: discussion_url
        tests:
          - not_null
          - unique
      - name: discussion_number
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_table_column_count_to_be_between:
          min_value: 1
      # discussion_number is only unique within a repo, not across repos
      - dbt_expectations.expect_compound_columns_to_be_unique:
          column_list: ["repo_owner", "repo_name", "discussion_number"]

  - name: dim_dbt_repos
    columns:
      # repo_name is only unique within an owner, see stg_github_repo_interactors__repos
      - name: full_name
        tests:
          - not_null
          - unique
      - name: repo_id
        tests:
          - not_null
          - unique
      - name: repo_name
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_table_column_count_to_be_between:
          min_value: 1

  - name: dim_medium_authors
    columns:
      - name: author_url
        tests:
          - not_null
          - unique
    tests:
      - dbt_expectations.expect_table_column_count_to_be_between:
          min_value: 1

  - name: fct_medium_blogs_per_day
    tests:
      - dbt_expectations.expect_table_column_count_to_be_between:
          min_value: 1

  - name: fct_medium_blogs
    tests:
      - dbt_expectations.expect_table_column_count_to_be_between:
          min_value: 1
